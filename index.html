<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 二次元 · 初音未来</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0a0c;
            overflow: hidden;
            position: relative;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* 替换为您的初音图片 */
            background-image: url('images/miku.PNG');
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) saturate(1.1);
        }
        .bg-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(20, 10, 30, 0.4) 0%, rgba(0, 0, 0, 0.7) 100%);
        }

        .main-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            animation: fadeInUp 1.2s ease-out;
        }

        .username {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #fbc2eb);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 6s ease infinite;
            text-shadow: 0 0 40px rgba(255, 150, 200, 0.3);
            margin-bottom: 8px;
            line-height: 1.2;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .subtitle i { margin: 0 6px; color: #ffb7c5; }

        /* 时钟样式（您复制的部分） */
        .clock-container {
            margin: 16px auto 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
            padding: 12px 20px;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: auto;
            max-width: 90%;
        }
        .clock {
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fbc2eb, #a18cd1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-variant-numeric: tabular-nums;
        }
        .clock-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            margin-top: 2px;
        }

        /* 以下为其他原有样式，保持完整 */
        .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 18px 0 30px; }
        .tag {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #f0e6ff;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        .tag:hover {
            background: rgba(255, 200, 220, 0.20);
            border-color: #ffb7c5;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 150, 200, 0.15);
        }
        .tag i { margin-right: 6px; color: #ffb7c5; }

        .social-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
        .social-links a {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 24px; border-radius: 60px;
            background: rgba(0, 0, 0, 0.30); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f0e6ff; text-decoration: none; font-size: 0.9rem;
            transition: all 0.3s; letter-spacing: 1px;
        }
        .social-links a i { font-size: 1.2rem; color: #ffb7c5; transition: transform 0.3s; }
        .social-links a:hover {
            background: rgba(255, 200, 220, 0.15);
            border-color: #ffb7c5;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 100, 150, 0.15);
        }
        .social-links a:hover i { transform: scale(1.2) rotate(5deg); }

        .footer { margin-top: 40px; font-size: 0.7rem; color: rgba(255, 255, 255, 0.30); letter-spacing: 3px; backdrop-filter: blur(4px); padding: 8px 0; }
        .footer i { color: #ffb7c5; margin: 0 4px; }

        .bio {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            padding: 18px 24px;
            border-radius: 20px;
            margin: 20px auto;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .bio p { color: #f0e6ff; font-size: 1.1rem; line-height: 1.8; text-align: center; letter-spacing: 2px; }
        .bio .sub-text { font-size: 0.9rem; color: #ffb7c5; letter-spacing: 3px; }

        /* 樱花 Canvas */
        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .username { letter-spacing: 3px; }
            .subtitle { letter-spacing: 4px; font-size: 0.9rem; padding: 4px 16px; }
            .social-links a { padding: 6px 14px; font-size: 0.75rem; }
            .tag { font-size: 0.7rem; padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <canvas id="sakura-canvas"></canvas>

    <div class="main-content">
        <!-- 您的用户名 -->
        <div class="username">rikushidou</div>

        <!-- 副标题（方案一） -->
        <div class="subtitle">
            <i class="fas fa-music"></i>
            初音未来 · 跨越次元的歌姬
            <i class="fas fa-music"></i>
        </div>

        <!-- 时钟 -->
        <div class="clock-container">
            <div class="clock" id="live-clock">--:--:--</div>
            <div class="clock-label">🎵 此刻 · 二次元时间 🎵</div>
        </div>

        <!-- BIO 卡片（方案一完整标语） -->
        <div class="bio">
            <p>
                🎵 与世界的第一声共鸣 🎵<br>
                <span class="sub-text">The First Sound from the Future</span>
            </p>
        </div>

        <!-- 社交链接 -->
        <div class="social-links">
            <a href="#" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            <a href="#" target="_blank"><i class="fab fa-twitter"></i> Twitter</a>
            <a href="#" target="_blank"><i class="fab fa-bilibili"></i> B站</a>
            <a href="#" target="_blank"><i class="fas fa-envelope"></i> 邮箱</a>
        </div>

        <div class="footer">
            <i class="fas fa-star"></i> 热爱即正义 · 二次元永存 <i class="fas fa-star"></i>
        </div>
    </div>

    <script>
        (function() {
            // === 樱花粒子 ===
            const canvas = document.getElementById('sakura-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let petals = [];
            const PETAL_COUNT = 45;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Petal {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height - height * 0.2;
                    this.size = Math.random() * 12 + 6;
                    this.speedX = (Math.random() - 0.5) * 0.8;
                    this.speedY = Math.random() * 1.2 + 0.6;
                    this.rotation = Math.random() * 360;
                    this.rotSpeed = (Math.random() - 0.5) * 3;
                    this.opacity = Math.random() * 0.5 + 0.4;
                    this.shape = Math.random() > 0.5 ? 0 : 1;
                }
                update() {
                    this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
                    this.y += this.speedY;
                    this.rotation += this.rotSpeed;
                    if (this.y > height + 20) { this.reset(); this.y = -20; }
                    if (this.x < -20) this.x = width + 20;
                    if (this.x > width + 20) this.x = -20;
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.globalAlpha = this.opacity;
                    ctx.shadowColor = 'rgba(255, 182, 193, 0.2)';
                    ctx.shadowBlur = 10;
                    const s = this.size;
                    ctx.beginPath();
                    if (this.shape === 0) {
                        for (let i = 0; i < 5; i++) {
                            const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                            const r = i === 0 ? s : s * 0.6;
                            const x = Math.cos(angle) * r;
                            const y = Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fillStyle = '#ffb7c5';
                    } else {
                        ctx.ellipse(0, 0, s * 0.5, s * 0.3, 0, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff9eb5';
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            function initPetals() {
                petals = [];
                for (let i = 0; i < PETAL_COUNT; i++) {
                    const p = new Petal();
                    p.y = Math.random() * height;
                    petals.push(p);
                }
            }
            initPetals();

            function animatePetals() {
                ctx.clearRect(0, 0, width, height);
                petals.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animatePetals);
            }
            animatePetals();

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resize();
                    petals.forEach(p => { p.x = Math.random() * width; p.y = Math.random() * height; });
                }, 300);
            });

            // === 实时时钟 ===
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;
            }
            updateClock();
            setInterval(updateClock, 1000);

            console.log('🌸 二次元主页已加载！');
        })();
    </script>

</body>
</html>
