        drop-shadow(0 0 6px rgba(255, 158, 181, 0.65))
        drop-shadow(0 0 12px rgba(161, 140, 209, 0.35));
}

/* 黑胶唱片 */
.vinyl-record {
    position: relative;
    z-index: 1;

    width: 132px;
    height: 132px;
    margin-bottom: 6px;

    border-radius: 50%;
    overflow: hidden;

    background:
        repeating-radial-gradient(
            circle at center,
            #17131b 0,
            #17131b 3px,
            #2c2632 4px,
            #2c2632 5px
        );

    border: 2px solid rgba(255, 255, 255, 0.20);

    box-shadow:
        0 0 20px rgba(255, 158, 181, 0.45),
        0 0 45px rgba(161, 140, 209, 0.25),
        inset 0 0 18px rgba(255, 255, 255, 0.08);

    animation: vinylSpin 7s linear infinite;
    animation-play-state: paused;
}

/* 播放时才旋转 */
.vinyl-record.playing {
    animation-play-state: running;
}

/* 唱片上的纹理光泽 */
.vinyl-record::before {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 2;
    border-radius: 50%;

    background:
        conic-gradient(
            from 20deg,
            transparent 0deg,
            rgba(255, 255, 255, 0.15) 35deg,
            transparent 70deg,
            transparent 180deg,
            rgba(255, 255, 255, 0.08) 220deg,
            transparent 260deg
        );

    pointer-events: none;
}

/* 唱片中心孔 */
.vinyl-record::after {
    content: "";

    position: absolute;
    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    z-index: 3;

    border-radius: 50%;
    background: #f9e7f1;

    box-shadow:
        0 0 0 3px rgba(20, 15, 25, 0.8),
        0 0 9px rgba(255, 183, 197, 0.8);

    transform: translate(-50%, -50%);
}

/* 唱片中央封面 */
.vinyl-cover {
    position: absolute;
    left: 25%;
    top: 25%;

    width: 50%;
    height: 50%;

    z-index: 1;

    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 20%;

    border: 2px solid rgba(255, 255, 255, 0.28);
}

/* 唱片旋转动画 */
@keyframes vinylSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

    <script>
        (function() {
            // === 樱花粒子 ===
            const canvas = document.getElementById('sakura-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let petals = [];
            const PETAL_COUNT = 45;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Petal {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height - height * 0.2;
                    this.size = Math.random() * 12 + 6;
                    this.speedX = (Math.random() - 0.5) * 0.8;
                    this.speedY = Math.random() * 1.2 + 0.6;
                    this.rotation = Math.random() * 360;
                    this.rotSpeed = (Math.random() - 0.5) * 3;
                    this.opacity = Math.random() * 0.5 + 0.4;
                    this.shape = Math.random() > 0.5 ? 0 : 1;
                }
                update() {
                    this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
                    this.y += this.speedY;
                    this.rotation += this.rotSpeed;
                    if (this.y > height + 20) { this.reset(); this.y = -20; }
                    if (this.x < -20) this.x = width + 20;
                    if (this.x > width + 20) this.x = -20;
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.globalAlpha = this.opacity;
                    ctx.shadowColor = 'rgba(255, 182, 193, 0.2)';
                    ctx.shadowBlur = 10;
                    const s = this.size;
                    ctx.beginPath();
                    if (this.shape === 0) {
                        for (let i = 0; i < 5; i++) {
                            const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                            const r = i === 0 ? s : s * 0.6;
                            const x = Math.cos(angle) * r;
                            const y = Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fillStyle = '#ffb7c5';
                    } else {
                        ctx.ellipse(0, 0, s * 0.5, s * 0.3, 0, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff9eb5';
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            function initPetals() {
                petals = [];
                for (let i = 0; i < PETAL_COUNT; i++) {
                    const p = new Petal();
                    p.y = Math.random() * height;
                    petals.push(p);
                }
            }
            initPetals();

            function animatePetals() {
                ctx.clearRect(0, 0, width, height);
                petals.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animatePetals);
            }
            animatePetals();

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resize();
                    petals.forEach(p => { p.x = Math.random() * width; p.y = Math.random() * height; });
                }, 300);
            });

            // === 实时时钟 ===
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;
            }
            updateClock();
            setInterval(updateClock, 1000);

            console.log('🌸 二次元主页已加载！');
        })();
    </script>

let spectrumAnimation = null;
let spectrumPlaying = false;


/* 调整 Canvas 清晰度 */
function resizeSpectrumCanvas() {
    const rect =
        spectrumCanvas.getBoundingClientRect();

    const devicePixelRatioValue =
        Math.min(window.devicePixelRatio || 1, 2);

    spectrumCanvas.width =
        Math.max(
            1,
            Math.round(
                rect.width * devicePixelRatioValue
            )
        );

    spectrumCanvas.height =
        Math.max(
            1,
            Math.round(
                rect.height * devicePixelRatioValue
            )
        );

    spectrumContext.setTransform(
        devicePixelRatioValue,
        0,
        0,
        devicePixelRatioValue,
        0,
        0
    );
}


resizeSpectrumCanvas();

window.addEventListener(
    'resize',
    resizeSpectrumCanvas
);


/* 第一次播放时创建音频分析器 */
function initializeSpectrum() {
    if (audioContext) {
        return;
    }

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContextClass) {
        console.warn('当前浏览器不支持音乐频谱。');
        return;
    }

    audioContext =
        new AudioContextClass();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 256;

    analyser.smoothingTimeConstant = 0.82;

    /*
     * 把 APlayer 的 audio 元素接入
     * Web Audio API 分析器
     */
    mediaSource =
        audioContext.createMediaElementSource(
            ap.audio
        );

    mediaSource.connect(analyser);

    /*
     * 必须重新连接到扬声器，
     * 否则经过分析器后可能没有声音
     */
    analyser.connect(
        audioContext.destination
    );

    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );
}


/* 绘制频谱 */
function drawSpectrum() {
    spectrumAnimation = null;

    const width =
        spectrumCanvas.clientWidth;

    const height =
        spectrumCanvas.clientHeight;

    spectrumContext.clearRect(
        0,
        0,
        width,
        height
    );

    if (
        !spectrumPlaying ||
        !analyser ||
        !frequencyData
    ) {
        return;
    }

    analyser.getByteFrequencyData(
        frequencyData
    );

    /*
     * 大屏幕显示18根音柱，
     * 手机显示10根，左右镜像。
     */
    const barsPerSide =
        width < 250 ? 10 : 18;

    /*
     * 唱片半径以及唱片和音柱间距
     */
    const recordRadius =
        width < 250 ? 48 : 72;

    const recordGap = 9;
    const barGap = 2.5;

    const sideWidth =
        width / 2 -
        recordRadius -
        recordGap;

    const barWidth =
        Math.max(
            2,
            (
                sideWidth -
                barGap *
                (barsPerSide - 1)
            ) /
            barsPerSide
        );

    /*
     * 粉色到紫色的渐变
     */
    const gradient =
        spectrumContext.createLinearGradient(
            0,
            height,
            0,
            0
        );

    gradient.addColorStop(
        0,
        'rgba(255, 158, 181, 0.35)'
    );

    gradient.addColorStop(
        0.55,
        'rgba(251, 194, 235, 0.85)'
    );

    gradient.addColorStop(
        1,
        'rgba(161, 140, 209, 1)'
    );

    spectrumContext.fillStyle = gradient;

    for (
        let index = 0;
        index < barsPerSide;
        index++
    ) {
        const frequencyIndex =
            Math.floor(
                (
                    index /
                    barsPerSide
                ) *
                frequencyData.length *
                0.72
            );

        const frequencyValue =
            frequencyData[frequencyIndex] /
            255;

        /*
         * 音量越高，柱子越高
         */
        const barHeight =
            5 +
            Math.pow(
                frequencyValue,
                1.18
            ) *
            (height - 20);

        const barY =
            height -
            barHeight -
            6;

        /*
         * 左侧音柱，从唱片旁向左展开
         */
        const leftX =
            width / 2 -
            recordRadius -
            recordGap -
            (index + 1) *
            barWidth -
            index *
            barGap;

        /*
         * 右侧镜像音柱
         */
        const rightX =
            width / 2 +
            recordRadius +
            recordGap +
            index *
            (
                barWidth +
                barGap
            );

        spectrumContext.globalAlpha =
            0.35 +
            frequencyValue * 0.65;

        spectrumContext.fillRect(
            leftX,
            barY,
            barWidth,
            barHeight
        );

        spectrumContext.fillRect(
            rightX,
            barY,
            barWidth,
            barHeight
        );
    }

    spectrumContext.globalAlpha = 1;

    spectrumAnimation =
        requestAnimationFrame(
            drawSpectrum
        );
}


/* 停止频谱和唱片 */
function stopMusicEffects() {
    spectrumPlaying = false;

    vinylRecord.classList.remove(
        'playing'
    );

    if (spectrumAnimation) {
        cancelAnimationFrame(
            spectrumAnimation
        );

        spectrumAnimation = null;
    }

    spectrumContext.clearRect(
        0,
        0,
        spectrumCanvas.clientWidth,
        spectrumCanvas.clientHeight
    );
}


/* 播放音乐 */
ap.audio.addEventListener(
    'play',
    async function () {
        try {
            initializeSpectrum();

            /*
             * 浏览器通常要求用户点击后
             * 才允许启动 AudioContext
             */
            if (
                audioContext &&
                audioContext.state ===
                'suspended'
            ) {
                await audioContext.resume();
            }

            spectrumPlaying = true;

            vinylRecord.classList.add(
                'playing'
            );

            if (!spectrumAnimation) {
                drawSpectrum();
            }
        } catch (error) {
            console.error(
                '音乐频谱启动失败：',
                error
            );

            /*
             * 即使频谱失败，
             * 唱片仍然能够旋转
             */
            vinylRecord.classList.add(
                'playing'
            );
        }
    }
);


/* 暂停音乐 */
ap.audio.addEventListener(
    'pause',
    stopMusicEffects
);
    </script>

/* 音乐播放结束 */
<!-- 鼠标点击樱花 -->
<script>
document.addEventListener('click', function (event) {
    /* 点击播放器和主题按钮时不生成樱花 */
    if (
        event.target.closest(
            '.aplayer, .theme-toggle'
        )
    ) {
        return;
    }

    const petalCount = 10;

    for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement('span');

        petal.className = 'click-sakura';
        petal.textContent = '🌸';

        petal.style.left = event.clientX + 'px';
        petal.style.top = event.clientY + 'px';

        const angle =
            (Math.PI * 2 * i) / petalCount +
            (Math.random() - 0.5) * 0.6;

        const distance =
            35 + Math.random() * 55;

        const moveX =
            Math.cos(angle) * distance;

        const moveY =
            Math.sin(angle) * distance;

        petal.style.setProperty(
            '--move-x',
            moveX + 'px'
        );

        petal.style.setProperty(
            '--move-y',
            moveY + 'px'
        );

        petal.style.setProperty(
            '--rotate',
            (Math.random() * 360 - 180) + 'deg'
        );

        petal.style.fontSize =
            (12 + Math.random() * 12) + 'px';

        petal.style.animationDuration =
            (650 + Math.random() * 400) + 'ms';

        document.body.appendChild(petal);

        petal.addEventListener(
            'animationend',
            function () {
                petal.remove();
            },
            { once: true }
        );
    }
});
</script>


<!-- 日间 / 夜间模式 -->
<script>
(function () {
    const themeToggle =
        document.getElementById('theme-toggle');

    const themeIcon =
        document.getElementById('theme-icon');

    if (!themeToggle || !themeIcon) {
        console.error('找不到主题切换按钮。');
        return;
    }

    function applyTheme(theme, shouldSave) {
        const isDayMode =
            theme === 'day';

        document.body.classList.toggle(
            'day-mode',
            isDayMode
        );

        themeIcon.className =
            isDayMode
                ? 'fas fa-moon'
                : 'fas fa-sun';

        const label =
            isDayMode
                ? '切换到夜间模式'
                : '切换到日间模式';

        themeToggle.setAttribute(
            'aria-label',
            label
        );

        themeToggle.setAttribute(
            'title',
            label
        );

        if (shouldSave) {
            try {
                localStorage.setItem(
                    'miku-theme',
                    theme
                );
            } catch (error) {
                console.warn(
                    '主题设置保存失败：',
                    error
                );
            }
        }
    }

    let savedTheme = 'night';

    try {
        const storedTheme =
            localStorage.getItem('miku-theme');

        if (
            storedTheme === 'day' ||
            storedTheme === 'night'
        ) {
            savedTheme = storedTheme;
        }
    } catch (error) {
        console.warn(
            '主题设置读取失败：',
            error
        );
    }

    applyTheme(savedTheme, false);

    themeToggle.addEventListener(
        'click',
        function () {
            const isDayMode =
                document.body.classList.contains(
                    'day-mode'
                );

            applyTheme(
                isDayMode ? 'night' : 'day',
                true
            );
        }
    );
})();
</script>
