<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 二次元 · 我的主页</title>
    <!-- 字体 & 图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0a0c;
            overflow: hidden;
            position: relative;
        }

        /* ===== 背景图片（替换为您的初音未来图片） ===== */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* ↓↓↓ 将下面的 URL 替换为您自己的图片链接或本地路径 ↓↓↓ */
            background-image: url('https://i.pinimg.com/originals/3a/8c/6a/3a8c6a8c6e4f9b0c6d8e9f0a1b2c3d4e.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) saturate(1.1);
            transition: filter 0.3s;
        }
        /* 如果图片加载失败，显示纯色后备 */
        .bg-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(20, 10, 30, 0.4) 0%, rgba(0, 0, 0, 0.7) 100%);
        }

        /* ===== 主内容容器 ===== */
        .main-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            animation: fadeInUp 1.2s ease-out;
        }

        /* 用户名（核心） */
        .username {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #fbc2eb);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 6s ease infinite;
            text-shadow: 0 0 40px rgba(255, 150, 200, 0.3);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            font-weight: 400;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .subtitle i {
            margin: 0 6px;
            color: #ffb7c5;
        }

        /* 装饰标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 30px;
        }
        .tag {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #f0e6ff;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        .tag:hover {
            background: rgba(255, 200, 220, 0.20);
            border-color: #ffb7c5;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 150, 200, 0.15);
        }
        .tag i {
            margin-right: 6px;
            color: #ffb7c5;
        }

        /* 社交链接 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f0e6ff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .social-links a i {
            font-size: 1.2rem;
            color: #ffb7c5;
            transition: transform 0.3s;
        }
        .social-links a:hover {
            background: rgba(255, 200, 220, 0.15);
            border-color: #ffb7c5;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 100, 150, 0.15);
        }
        .social-links a:hover i {
            transform: scale(1.2) rotate(5deg);
        }

        /* 底部版权 */
        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.30);
            letter-spacing: 3px;
            backdrop-filter: blur(4px);
            padding: 8px 0;
        }
        .footer i {
            color: #ffb7c5;
            margin: 0 4px;
        }

        /* ===== 樱花飘落（Canvas） ===== */
        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ===== 动画 ===== */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 480px) {
            .username {
                letter-spacing: 3px;
            }
            .subtitle {
                letter-spacing: 4px;
                font-size: 0.9rem;
                padding: 4px 16px;
            }
            .social-links a {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            .tag {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 背景图片层 ===== -->
    <div class="bg-image"></div>

    <!-- ===== 樱花飘落 Canvas ===== -->
    <canvas id="sakura-canvas"></canvas>

    <!-- ===== 主要内容 ===== -->
    <div class="main-content">

        <!-- ★★★ 在这里修改您的用户名 ★★★ -->
        <div class="username">Rikushidou</div>

        <div class="subtitle">
            <i class="fas fa-heart"></i>
            永遠の二次元
            <i class="fas fa-heart"></i>
        </div>

        <div class="tags">
            <span class="tag"><i class="fas fa-palette"></i> 绘画</span>
            <span class="tag"><i class="fas fa-music"></i> VOCALOID</span>
            <span class="tag"><i class="fas fa-gamepad"></i> 游戏</span>
            <span class="tag"><i class="fas fa-cat"></i> 猫系</span>
        </div>

        <div class="social-links">
            <a href="#" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            <a href="#" target="_blank"><i class="fab fa-twitter"></i> Twitter</a>
            <a href="#" target="_blank"><i class="fab fa-bilibili"></i> B站</a>
            <a href="#" target="_blank"><i class="fas fa-envelope"></i> 邮箱</a>
        </div>

        <div class="footer">
            <i class="fas fa-star"></i> 热爱即正义 · 二次元永存 <i class="fas fa-star"></i>
        </div>

    </div>

    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ===== 樱花飘落粒子系统 =====
            const canvas = document.getElementById('sakura-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let petals = [];
            const PETAL_COUNT = 45;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // 随机生成花瓣
            class Petal {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height - height * 0.2;
                    this.size = Math.random() * 12 + 6;
                    this.speedX = (Math.random() - 0.5) * 0.8;
                    this.speedY = Math.random() * 1.2 + 0.6;
                    this.rotation = Math.random() * 360;
                    this.rotSpeed = (Math.random() - 0.5) * 3;
                    this.opacity = Math.random() * 0.5 + 0.4;
                    this.shape = Math.random() > 0.5 ? 0 : 1; // 两种花瓣形状
                }
                update() {
                    this.x += this.speedX + Math.sin(this.y * 0.01) * 0.3;
                    this.y += this.speedY;
                    this.rotation += this.rotSpeed;
                    if (this.y > height + 20) {
                        this.reset();
                        this.y = -20;
                    }
                    if (this.x < -20) this.x = width + 20;
                    if (this.x > width + 20) this.x = -20;
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.globalAlpha = this.opacity;
                    ctx.shadowColor = 'rgba(255, 182, 193, 0.2)';
                    ctx.shadowBlur = 10;

                    const s = this.size;
                    ctx.beginPath();
                    if (this.shape === 0) {
                        // 樱花形状（五瓣简化）
                        for (let i = 0; i < 5; i++) {
                            const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                            const r = i === 0 ? s : s * 0.6;
                            const x = Math.cos(angle) * r;
                            const y = Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fillStyle = '#ffb7c5';
                    } else {
                        // 椭圆花瓣
                        ctx.ellipse(0, 0, s * 0.5, s * 0.3, 0, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff9eb5';
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            function initPetals() {
                petals = [];
                for (let i = 0; i < PETAL_COUNT; i++) {
                    const p = new Petal();
                    p.y = Math.random() * height; // 初始分散
                    petals.push(p);
                }
            }
            initPetals();

            function animatePetals() {
                ctx.clearRect(0, 0, width, height);
                petals.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animatePetals);
            }
            animatePetals();

            // 窗口尺寸变化重置花瓣位置
            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resize();
                    petals.forEach(p => {
                        p.x = Math.random() * width;
                        p.y = Math.random() * height;
                    });
                }, 300);
            });

            // ===== 控制台欢迎 =====
            console.log('🌸 二次元主页已加载！欢迎来到我的世界～');
        })();
    </script>

    <!-- 说明：替换背景图片和用户名 -->
    <!--
    1. 替换背景图片：
       在 .bg-image 的 background-image 中替换 URL 或改为本地路径，如：
       url('images/miku.jpg')
       您可以下载初音未来壁纸放到仓库的 images 文件夹中。

    2. 修改用户名：
       找到 <div class="username">Rikushidou</div> 改为您的名字。

    3. 修改社交链接：
       将 href="#" 替换为您的真实链接。
    -->
</body>
</html>
